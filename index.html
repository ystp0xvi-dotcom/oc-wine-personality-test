<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OC酒塑测试18问</title>
<style>
:root{
  --bg:#FFF6F2;
  --card:#F6DAD7;
  --content:#FCEAE6;
  --content-hover:#B4524B;
  --green:#8C3B4A;
  --accent:#D8A857;
  --text:#4A3733;
  --muted:#9C8580;
  --white:#FFFDFB;
  --border:rgba(74,55,51,.14);
  --bar-bg:rgba(74,55,51,.12);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{width:min(760px,100%);margin:auto;padding:28px 24px 18px}
h1{margin:8px 0 12px;font-size:clamp(30px,7vw,42px);line-height:1.15;letter-spacing:-.03em;color:var(--green)}
.intro{margin:0 0 20px;line-height:1.85;color:var(--muted)}
.hero,.card{border-radius:30px;padding:28px;margin:20px 0;box-shadow:0 8px 26px rgba(74,55,51,.08)}
.hero{background:var(--card);color:var(--green)}
.hero h2{margin:0 0 14px;font-size:23px;line-height:1.45}
.tag{display:inline-block;margin:5px 6px 0 0;padding:8px 14px;border-radius:999px;background:var(--white);color:var(--green);font-size:13px;letter-spacing:.04em}
#app{margin-top:16px}
.progress{background:rgba(255,253,251,.72);border:1px solid var(--border);border-radius:24px;padding:13px 16px;margin:14px 0}
.progress-row{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.bar-track{height:8px;margin-top:9px;overflow:hidden;border-radius:999px;background:var(--bar-bg)}
.bar{height:100%;border-radius:999px;background:var(--green);transition:width .25s ease}
.card{background:var(--card)}
.question-card{background:var(--content)}
.question-meta{margin:0 0 10px;color:var(--green);font-size:14px;font-weight:600;letter-spacing:.04em}
.card h2{margin:0 0 18px;line-height:1.55;font-size:21px;color:var(--green)}
.option{background:rgba(255,253,251,.64);border:1px solid rgba(74,55,51,.12);border-radius:18px;padding:16px 17px;margin:12px 0;line-height:1.55;cursor:pointer;transition:.18s ease}
.option:hover{background:rgba(255,253,251,.9);transform:translateY(-1px)}
.option.selected{background:var(--content-hover);border-color:rgba(74,55,51,.25);color:#fff}
.option-label{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;margin-right:9px;border-radius:50%;background:rgba(74,55,51,.09);color:var(--green);font-weight:700}
.option.selected .option-label{background:rgba(255,255,255,.35);color:#fff}
button{width:100%;margin-top:18px;padding:15px 18px;border-radius:22px;font-size:17px;font-weight:600;cursor:pointer;transition:.18s ease;border:none}
.nav-buttons button:not(.secondary-btn){background:var(--green);color:var(--white);border:1px solid var(--green)}
.secondary-btn{background:rgba(255,253,251,.75);border:2px solid var(--card);color:var(--muted)}
button:disabled{opacity:.45;cursor:not-allowed}
button:active{transform:scale(.99)}
.nav-buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nav-buttons button{margin-top:18px}

.result-card{background:var(--content);padding:32px 28px}
.result-header{text-align:center;margin-bottom:28px;padding-bottom:24px;border-bottom:1px solid var(--border)}
.result-label{font-size:13px;letter-spacing:.18em;color:var(--muted);margin-bottom:10px;text-transform:uppercase}
.result-plant{font-size:clamp(34px,8vw,46px);font-weight:700;color:var(--green);margin:0 0 8px;letter-spacing:-.02em}
.result-tagline{font-size:18px;color:var(--text);margin:0;font-weight:500}
.result-section{margin:26px 0}
.result-section h3{margin:0 0 12px;font-size:16px;color:var(--green);letter-spacing:.06em}
.result-section p{margin:0 0 10px;line-height:1.75;color:var(--text)}
.dim-list{margin:16px 0 8px}
.dim-row{display:grid;grid-template-columns:90px 1fr 36px;align-items:center;gap:12px;margin:10px 0;font-size:14px}
.dim-name{color:var(--muted)}
.dim-value{text-align:right;color:var(--green);font-weight:600}
.dim-bar-track{height:10px;border-radius:999px;background:var(--bar-bg);overflow:hidden}
.dim-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--green),var(--accent));transition:width .4s ease}
.tags-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.role-tag{display:inline-block;padding:7px 14px;border-radius:999px;background:rgba(216,168,87,.22);color:#8A6418;font-size:13px;font-weight:500}
.restart-btn{background:var(--green);color:var(--white);border:1px solid var(--green);margin-top:10px}
.footer{text-align:center;margin:8px 0 10px;color:var(--green);font-size:13px;letter-spacing:.08em}

.result-extra{margin:28px 0 0;padding-top:24px;border-top:1px solid var(--border)}
.extra-title{margin:0 0 12px;font-size:16px;color:var(--green);letter-spacing:.06em}
.wine-review{margin:0;padding:16px 18px;border-radius:18px;background:rgba(216,168,87,.13);font-size:17px;line-height:1.7;font-weight:600}
.tasting-list{display:grid;gap:9px}
.tasting-item{padding:12px 14px;border-radius:15px;background:rgba(255,253,251,.62);line-height:1.65}
.tasting-item b{color:var(--green)}
.highlight-list{display:flex;flex-wrap:wrap;gap:8px}
.highlight-item{padding:8px 13px;border-radius:999px;background:rgba(255,253,251,.75);font-size:13px;color:var(--text)}
.scene-box{padding:15px 17px;border-left:3px solid var(--accent);background:rgba(216,168,87,.08);border-radius:4px 16px 16px 4px;line-height:1.75}
.hidden-box{padding:16px 18px;border-radius:18px;background:rgba(140,59,74,.07);line-height:1.8}

@media (max-width:560px){
  main{padding:20px 15px 14px}
  .hero,.card{padding:21px;border-radius:24px}
  .hero h2{font-size:20px}
  .card h2{font-size:19px}
  .option{padding:14px}
  .result-card{padding:24px 20px}
  .dim-row{grid-template-columns:72px 1fr 32px}
}
</style>
</head>

<body>
<main>
  <h1>OC酒塑测试18问</h1>
  <p class="intro">通过关系倾向、探索欲、独立性与守护性，探索你的OC最契合的酒塑。</p>

  <div class="hero">
    <h2>像动物塑一样，测出你的OC酒塑。</h2>
    <span class="tag">18 QUESTIONS</span>
    <span class="tag">24 TYPES</span>
    <span class="tag">WINE PROFILE</span>

  <div id="app"></div>
  <div class="footer">@收藏夹里的熊</div>
</main>

<script>

const wines = [
  {name:"精酿IPA",tagline:"苦味鲜明、个性张扬的先锋派",
    analysis:"IPA以浓烈的啤酒花苦味和强烈的个性著称，入口直接、毫不掩饰自己的态度。你的OC表达欲强，习惯用最直接的方式展现自己的立场，不害怕被说“太冲”。<br><br>这种鲜明个性容易让TA在人群中被记住，也是团队里敢于表达不同意见的那个人。",
    roles:["先锋派","直言不讳者","态度担当"],review:"入口锋利，个性鲜明，第一口就让人记住。",tasting:["初见：不绕弯，存在感很强。", "相处：越熟越能发现TA其实很讲原则。", "余韵：离开人群后，TA留下的态度依然很鲜明。"],highlights:["需要有人率先打破沉默", "团队意见僵持、需要明确表态", "陌生环境里主动打开局面"],scene:"夜晚的地下酒吧 / 临时起意的聚会 / 一群人聊到兴起的深夜",hidden:"锋利之外，TA还有一套自己很看重的原则与坚持。"},
  {name:"世涛黑啤",tagline:"浓郁醇厚、深沉内敛的沉稳派",
    analysis:"世涛以焦香浓郁、口感厚重著称，初尝浓烈，细品却能发现层层复杂的风味。你的OC情绪不轻易外露，但内心世界远比表面丰富，习惯把复杂的情感沉淀之后再表达。<br><br>这种沉稳感让TA成为值得信赖的倾听者。",
    roles:["沉稳担当","深藏不露者","情绪沉淀者"],review:"浓郁而克制，第一口沉静，回味却很深。",tasting:["初见：话不多，情绪藏得很稳。", "相处：熟悉之后，会发现TA的内心层次远比表面丰富。", "余韵：越是离开之后，越容易想起TA没说出口的部分。"],highlights:["深夜长谈", "需要耐心倾听的场合", "复杂局面中保持冷静"],scene:"雨夜室内 / 昏暗酒吧角落 / 两个人慢慢聊到很晚",hidden:"TA的情绪并不总是直接呈现，更多时候会先在心里沉淀。"},
  {name:"赤霞珠",tagline:"结构感强、掌控全局的领袖气质",
    analysis:"赤霞珠厚重、品味分明，是红酒里最具“掌控感”的品种之一，陈年后愈发有层次。你的OC天生具备领导气质，习惯把控大局，在复杂局面里依然能保持清晰的判断。<br><br>这种掌控力让TA很容易成为团队的核心支柱。",
    roles:["掌控者","领袖气质","领导型人格"],review:"骨架稳、力量足，属于越品越能感到掌控力的一杯。",tasting:["初见：可靠、有主见，很难被忽略。", "相处：会自然承担决策与收拾残局的角色。", "余韵：即使不在场，也容易成为大家默认的参照。"],highlights:["需要做决定的时候", "团队陷入混乱的时候", "重要场合承担核心责任"],scene:"正式晚宴 / 重要庆祝 / 一场需要主心骨的聚会",hidden:"掌控感的另一面，是TA对秩序、确定性与局面走向的敏锐关注。"},
  {name:"黑皮诺",tagline:"细腻敏感、难以捉摸的优雅浪漫派",
    analysis:"黑皮诺娇贵难种，风味细腻多变，同一片土地也可能酿出截然不同的表达。你的OC情感丰富且敏锐，情绪常常随环境微妙变化，拥有极高的感知力和审美。<br><br>这种细腻让TA在情感表达和艺术感知上极具优势。",
    roles:["优雅浪漫派","敏感知觉者","多变灵魂"],review:"轻盈、细腻又难以一次看透，回味比入口更动人。",tasting:["初见：安静、优雅，不急着展示自己。", "相处：细微的情绪变化会被TA一一捕捉。", "余韵：真正熟悉后，才会发现TA有很多层。"],highlights:["两个人独处", "需要察觉微妙情绪的场合", "艺术、创作与审美相关的环境"],scene:"安静餐厅 / 雨天窗边 / 深夜散步后的慢聊",hidden:"TA对关系里的细微变化很敏锐，常常能较早察觉气氛与情绪的变化。"},
  {name:"波特酒",tagline:"甜美浓郁、念旧深情的怀旧派",
    analysis:"波特酒经强化陈酿，风味甜美浓郁，越陈越香，常被用来纪念重要的时刻。你的OC重视回忆与情感的沉淀，习惯把珍贵的经历反复回味，对旧日时光怀有深厚的眷恋。<br><br>这种深情让TA在关系里格外令人安心。",
    roles:["怀旧派","深情守候者","回忆收藏家"],review:"甜而不轻浮，像一段被时间反复温习过的旧回忆。",tasting:["初见：温和，容易让人产生亲近感。", "相处：会慢慢分享自己的故事与珍贵记忆。", "余韵：真正让人舍不得的，是TA对过去的认真。"],highlights:["旧友重逢", "纪念重要时刻", "需要珍惜关系与回忆的场合"],scene:"老房子里的晚餐 / 冬夜壁炉旁 / 翻旧照片时的一杯酒",hidden:"TA会把珍贵的人与事长久地放在记忆里，并反复回想其中的细节。"},
  {name:"酱香型白酒",tagline:"层次复杂、后劲悠长的深藏不露者",
    analysis:"酱香型白酒酿造工艺复杂，风味层次丰富，初尝温和，后劲却绵长持久。你的OC表面低调平和，实际内涵深厚，真正了解TA需要时间，但一旦熟悉就会发现TA远比初印象复杂精彩。<br><br>这种深度让TA经得起长期相处和细品。",
    roles:["深藏不露者","后劲担当","复杂灵魂"],review:"初入口不急着讨好，真正的层次要留给时间。",tasting:["初见：低调、克制，不容易被一眼看透。", "相处：越熟悉，越能发现复杂而稳定的内核。", "余韵：长期相处后反而越来越有分量。"],highlights:["长期合作", "复杂问题需要耐心拆解", "只有少数人真正了解TA的关系里"],scene:"老友小聚 / 长桌宴席 / 一场从傍晚聊到深夜的谈话",hidden:"TA的沉默往往意味着仍在观察与整理，通常会对真正信任的人表达更多。"},
  {name:"清香型白酒",tagline:"清冽干净、直来直去的纯粹派",
    analysis:"清香型白酒口感清爽纯净，工艺讲究“清字当头”，不追求复杂修饰。你的OC性格直接坦率，不喜欢拐弯抹角，待人处事干脆利落，是让人很省心的类型。<br><br>这种纯粹感让TA值得信赖。",
    roles:["纯粹派","直率担当","清爽系人格"],review:"干净、利落，不需要多余修饰就能让人记住。",tasting:["初见：直率，不太让人费劲猜。", "相处：边界清楚，答应的事情通常说到做到。", "余韵：留下的是一种简单可靠的安心感。"],highlights:["需要快速沟通", "合作分工明确的团队", "关系里需要坦诚表达的时候"],scene:"清爽的白昼 / 简单的家宴 / 几个熟人直接聊正事",hidden:"TA倾向于保留最直接、最清晰的表达，把不必要的复杂留在表面之外。"},
  {name:"桂花酒",tagline:"温柔绵软、甜而不腻的治愈系",
    analysis:"桂花酒香气温柔馥郁，入口绵软回甘，带着浓浓的秋日治愈感。你的OC性格温和体贴，总能用恰到好处的温柔抚平周围人的情绪，不会让人感到压力。<br><br>这种治愈力让TA成为团队里的情绪稳定剂。",
    roles:["治愈系","温柔担当","情绪稳定剂"],review:"香气柔和，入口温润，是让人不自觉放松下来的一杯。",tasting:["初见：温柔，没有强烈的压迫感。", "相处：会自然照顾到别人的情绪。", "余韵：即使没有说很多话，也会让人觉得被安稳地接住。"],highlights:["朋友情绪低落时", "第一次融入新群体", "需要缓和紧张气氛的时候"],scene:"秋日晚风 / 温暖的小餐馆 / 一群熟人慢慢吃饭聊天",hidden:"TA的温柔并非没有底线，只是习惯先照顾别人，再处理自己的情绪。"},
  {name:"单一麦芽威士忌",tagline:"特立独行、坚持本味的孤傲匠人",
    analysis:"单一麦芽威士忌坚持只用一种麦芽、一座蒸馏厂出产，拒绝混调，风味个性鲜明。你的OC有自己坚持的标准，不愿为了迎合他人而改变本色，宁缺毋滥。<br><br>这种坚持让TA的作品/人格辨识度极高。",
    roles:["孤傲匠人","原味主义者","标准坚持者"],review:"不靠讨好取胜，坚持自己的风味，越懂的人越容易喜欢。",tasting:["初见：有距离感，不急着迎合。", "相处：会发现TA拥有非常稳定的个人标准。", "余韵：真正留下的是辨识度，而不是热闹。"],highlights:["独立完成创作", "面对群体意见仍坚持原则", "需要专业判断与个人审美的场合"],scene:"一个人的深夜工作台 / 安静酒吧 / 只邀请少数人的小聚",hidden:"TA对自己的标准与偏好有明确坚持，不太会为了获得认同而改变它们。"},
  {name:"泥煤威士忌",tagline:"浓烈粗犷、不加掩饰的野性派",
    analysis:"泥煤威士忌带着浓烈的烟熏泥煤气息，风味粗犷直接，爱憎分明，没有中间地带。你的OC情感浓烈、表达张扬，从不掩饰自己的喜怒，是让人一眼记住的存在。<br><br>这种野性魅力极具感染力。",
    roles:["野性派","浓烈担当","爱憎分明者"],review:"烟熏、浓烈、毫不退让，属于一入口就有态度的酒。",tasting:["初见：攻击性和存在感都很强。", "相处：爱憎分明，喜欢就是喜欢，不喜欢也很难装。", "余韵：即使不合口味，也很难忘记。"],highlights:["需要强烈表达立场", "危机或冲突场合", "所有人都过于谨慎时"],scene:"深夜Live House / 风很大的户外 / 一场毫不客气的坦白",hidden:"浓烈的表达背后，有着清晰而明确的情感立场。"},
  {name:"波本威士忌",tagline:"热情直爽、甜蜜奔放的豪迈派",
    analysis:"波本威士忌带着焦糖和香草的甜香，口感圆润奔放，是美式豪迈的代表。你的OC热情开朗，待人真诚直接，情绪感染力强，很容易把气氛带动起来。<br><br>这种豪迈让TA总能成为聚会里的焦点。",
    roles:["豪迈派","热情担当","气氛带动者"],review:"甜香明亮、热情直接，是一杯会主动把气氛点亮的酒。",tasting:["初见：很快就能和人熟起来。", "相处：喜欢把快乐分享出去。", "余韵：想到TA时，往往先想到热闹和笑声。"],highlights:["朋友聚会", "第一次认识新朋友", "需要把冷场重新炒热的时候"],scene:"夏夜露台 / 篝火旁 / 热闹的朋友聚会",hidden:"TA习惯用轻松的方式面对许多事情，同时也会珍惜真正愿意认真倾听的人。"},

  ]},
  {q:"面对“今晚不醉不归”的提议，你的OC会？",opts:[
    {t:"按自己的酒量来，不被气氛裹挟",s:[0,0,2,0]},
    {t:"提醒大家注意身体，适度就好",s:[0,0,0,2]},

    {t:"很享受这种和大家一起放开的氛围",s:[2,0,0,0]}
  ]},
  {q:"你的OC珍藏一瓶酒的理由是？",opts:[
    {t:"因为这瓶酒承载着和某人的回忆",s:[2,0,0,0]},
    {t:"单纯因为自己很喜欢这个味道",s:[0,0,2,0]},
    {t:"想留到对的人出现时，一起分享",s:[0,0,0,2]},

  ]},
  {q:"换一个陌生的酒吧，你的OC会？",opts:[
    {t:"先留意这里安不安全、靠不靠谱",s:[0,0,0,2]},

    {t:"希望能认识一些新朋友",s:[2,0,0,0]},
    {t:"自己找个角落，安静感受这里的氛围",s:[0,0,2,0]}
  ]},
  {q:"你的OC觉得“好酒”的标准是？",opts:[
    {t:"能带来意料之外的风味体验",s:[0,2,0,0]},

/* ========== 状态 ========== */
let index = 0;
let answers = [];
let scores = [0,0,0,0]; // 关系 / 探索 / 独立 / 守护
const TOTAL = questions.length;

function render(){
  if(index >= TOTAL){ return showResult(); }

  const item = questions[index];
  const percent = Math.round((index/TOTAL)*100);

  document.getElementById('app').innerHTML = `
    <div class="progress">
      <div class="progress-row">
        <span>第 ${index+1} / ${TOTAL} 题</span>
        <span>${percent}%</span>
      </div>
      <div class="bar-track"><div class="bar" style="width:${percent}%"></div></div>
    </div>

    <section class="card question-card">
      <p class="question-meta">QUESTION ${String(index+1).padStart(2,'0')}</p>
      <h2>${item.q}</h2>
      ${item.opts.map((o,i)=>`
        <div class="option ${answers[index]===i?'selected':''}" onclick="choose(${i},this)">
          <span class="option-label">${String.fromCharCode(65+i)}</span>${o.t}
        </div>
      `).join('')}
      <div class="nav-buttons">
        <button class="secondary-btn" onclick="prev()" ${index===0?'disabled':''}>上一题</button>
        <button onclick="next()">下一题</button>
      </div>
    </section>
  `;
}

function choose(i, el){
  answers[index]=i;
  document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));
  el.classList.add('selected');
}

function recompute(){
  scores=[0,0,0,0];
  answers.forEach((a,qi)=>{
    if(a===undefined) return;
    const s=questions[qi].opts[a].s;
    scores[0]+=s[0]; scores[1]+=s[1]; scores[2]+=s[2]; scores[3]+=s[3];
  });
}

function next(){
  if(answers[index]===undefined) return;
  recompute();
  index++;
  render();
}

function prev(){
  if(index>0){ recompute(); index--; render(); }
}

function normalize(arr){
  const max=Math.max(...arr,1);
  return arr.map(v=>Math.round((v/max)*100));
}

function pickWine(){
  // 四维度排序哈希映射（改进版）
  // 1. 按得分从高到低排序（同分按维度索引稳定打破）
  // 2. 将排列转换为 0~23 的 Lehmer 码
  // 3. 再叠加最高维与次高维的实际分值，打散并列情况，使 24 种结果概率接近均匀
  const c = scores.map(s => s / 2); // 转为 0~18 的计数
  const dims = [0, 1, 2, 3];
  dims.sort((a, b) => c[b] - c[a] || a - b);

  let available = [0, 1, 2, 3];
  let id = 0;
  for (let i = 0; i < 3; i++) {
    const idx = available.indexOf(dims[i]);
    id = id * (4 - i) + idx;
    available.splice(idx, 1);
  }
  // 用最高与次高维度的计数值进一步打散，提升均匀性
  id = (id + c[dims[0]] * 2 + c[dims[1]]) % 24;
  return id;
}

function showResult(){
  recompute();
  const id = pickWine();
  const w = wines[id];
  const dims = normalize(scores);
  const dimNames = ['关系倾向','探索欲','独立性','守护性'];

  document.getElementById('app').innerHTML = `
    <section class="card result-card">
      <div class="result-header">
        <div class="result-label">YOUR OC WINE TYPE</div>
        <h2 class="result-plant">${w.name}</h2>
        <p class="result-tagline">${w.tagline}</p>
      </div>

      <div class="result-section">
        <h3>维度对比</h3>
        <div class="dim-list">
          ${dimNames.map((name,i)=>`
            <div class="dim-row">
              <span class="dim-name">${name}</span>
              <div class="dim-bar-track"><div class="dim-bar" style="width:${dims[i]}%"></div></div>
              <span class="dim-value">${dims[i]}</span>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="result-section">
        <h3>类型分析</h3>
        <p>${w.analysis}</p>
      </div>

      <div class="result-extra">
        <h3 class="extra-title">一句话酒评</h3>
        <p class="wine-review">${w.review}</p>
      </div>

      <div class="result-extra">
        <h3 class="extra-title">观色 · 闻香 · 品味</h3>
        <div class="tasting-list">
          ${w.tasting.map((x,i)=>{
            const labels=['观色','闻香','品味'];
            return `<div class="tasting-item"><b>${labels[i]}</b>　${x.replace(/^[^：]*：/,'')}</div>`;
          }).join('')}
        </div>
      </div>

      <div class="result-extra">
        <h3 class="extra-title">高光时刻</h3>
        <div class="highlight-list">
          ${w.highlights.map(x=>`<span class="highlight-item">${x}</span>`).join('')}
        </div>
      </div>

      <div class="result-extra">
        <h3 class="extra-title">最佳饮用场景</h3>
        <div class="scene-box">${w.scene}</div>
      </div>

      <div class="result-extra">
        <h3 class="extra-title">隐藏风味</h3>
        <div class="hidden-box">${w.hidden}</div>
      </div>

      <div class="result-section">
        <h3>适合OC定位</h3>
        <div class="tags-row">${w.roles.map(r=>`<span class="role-tag">${r}</span>`).join('')}</div>
      </div>

      <button class="restart-btn" onclick="restart()">重新测试</button>
    </section>
  `;
}

function restart(){
  index=0; answers=[]; scores=[0,0,0,0];
  render();
}

render();
</script>
